# K8s 集群 inventory（2026-10-05 补充）
# 原/etc/ansible/hosts 里只有旧机房 172.16.x.x 资产，无 K8s 节点

[k8s_all:children]
k8s_cp
k8s_worker

# ---------- control-plane ----------
[k8s_cp]
m01        ansible_host=10.0.0.61
master01   ansible_host=10.0.0.121
master02   ansible_host=10.0.0.120

# ---------- worker ----------
[k8s_worker]
worker01   ansible_host=10.0.0.122
worker02   ansible_host=10.0.0.123
worker03   ansible_host=10.0.0.124

# ---------- 元数据 ----------
[k8s_all:vars]
ansible_user=root
ansible_connection=paramiko
ansible_python_interpreter=/usr/bin/python3
# 密码不写入此文件，用 ansible-vault 或 -k 交互传入

[k8s_cp:vars]
node_role=control-plane

[k8s_worker:vars]
node_role=worker
