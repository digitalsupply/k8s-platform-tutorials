apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  labels:
    cnpg.io/cluster: pg16-ceph
  name: pg16-ceph-daily-full
  namespace: cnpg-system
spec:
  backupOwnerReference: self
  cluster:
    name: pg16-ceph
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 0 2 * * *
