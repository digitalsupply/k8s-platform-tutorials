# ArgoCD 拉取 GitLab 仓库的凭据示例
#
# 使用前：
#   1. 在 GitLab 创建 PAT（read_repository）或 Deploy Token；
#   2. 替换 url / username / password；
#   3. 自签或 HTTP 环境才设置 insecure: "true"。
#
# 不要把真实 token 提交到 Git。
apiVersion: v1
kind: Secret
metadata:
  name: platform-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: http://192.168.67.201/digitalsupply/platform-gitops.git
  username: <GITLAB-USERNAME>
  password: <PAT-OR-DEPLOY-TOKEN>
  insecure: "true"
