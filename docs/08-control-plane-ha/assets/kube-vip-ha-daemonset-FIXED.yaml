apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip-ds
    app.kubernetes.io/version: v1.2.4
  annotations:
    kube-vip-fix/timestamp: '2026-10-04'
    kube-vip-fix/round1: vip_preserve_on_leadership_loss=true; lease 5/3/1 -> 15/10/2;
      resources; priorityClassName; terminationGracePeriodSeconds
    kube-vip-fix/round2: image v1.0.3 -> v1.2.4
    kube-vip-fix/note: kubelet.conf VIP-decoupling (m01) is a node-level change, not
      part of this manifest; see report section 6.2.2
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-ds
        app.kubernetes.io/version: v1.2.4
    spec:
      containers:
      - args:
        - manager
        env:
        - name: vip_preserve_on_leadership_loss
          value: 'true'
        - name: vip_arp
          value: 'true'
        - name: port
          value: '6443'
        - name: vip_nodename
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: vip_interface
          value: eth0
        - name: vip_subnet
          value: '24'
        - name: dns_mode
          value: first
        - name: dhcp_mode
          value: ipv4
        - name: cp_enable
          value: 'true'
        - name: cp_namespace
          value: kube-system
        - name: vip_leaderelection
          value: 'true'
        - name: vip_leasename
          value: plndr-cp-lock
        - name: vip_leaseduration
          value: '15'
        - name: vip_renewdeadline
          value: '10'
        - name: vip_retryperiod
          value: '2'
        - name: enable_node_labeling
          value: 'true'
        - name: vip_address
          value: 10.0.0.168
        - name: prometheus_server
          value: :2112
        image: ghcr.io/kube-vip/kube-vip:v1.2.4
        imagePullPolicy: IfNotPresent
        name: kube-vip
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/kubernetes/admin.conf
          name: kubeconfig
      dnsPolicy: ClusterFirst
      hostAliases:
      - hostnames:
        - kubernetes
        ip: 127.0.0.1
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 15
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - hostPath:
          path: /etc/kubernetes/admin.conf
          type: ''
        name: kubeconfig
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
