{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy-{{ .name }}
    app.kubernetes.io/part-of: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: oauth2-proxy-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: oauth2-proxy-{{ .name }}
        app.kubernetes.io/part-of: sso
    spec:
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oauth2-proxy
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ $.Values.issuerURL }}
            - --provider-display-name=GitLab
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - "--scope=openid profile email"
            - --code-challenge-method=S256
            - --oidc-groups-claim=groups
            - --redirect-url=https://{{ .host }}/oauth2/callback
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --http-address=0.0.0.0:4180
            - --upstream={{ .upstream }}
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: {{ .clientID | quote }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
