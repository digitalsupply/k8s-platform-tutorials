### /etc/containerd/certs.d/10.0.0.41/hosts.toml
# 原始服务器地址（使用 http）
server = "http://10.0.0.41"

[host."http://10.0.0.41"]
  # 关键：增加 push 权限
  capabilities = ["pull", "resolve", "push"]

  # 既然是 HTTP，建议显式跳过证书校验
  skip_verify = true


### /etc/containerd/certs.d/192.168.67.202:8443/hosts.toml
server = "https://192.168.67.202:8443"

[host."https://192.168.67.202:8443"]
  capabilities = ["pull", "resolve", "push"]
  skip_verify = true

### /etc/containerd/certs.d/docker.io/hosts.toml
server = "https://registry-1.docker.io"

# 换网段后 registry-1.docker.io 在本网络不可达(TCP 超时)，走加速地址
# 顺序即优先级，失败自动回退到下一个
[host."https://docker.m.daocloud.io"]
  capabilities = ["pull", "resolve"]

[host."https://docker.1ms.run"]
  capabilities = ["pull", "resolve"]

### /etc/containerd/certs.d/gcr.io/hosts.toml
server = "https://gcr.io"

# gcr.io 在本网络同样不可达
[host."https://gcr.m.daocloud.io"]
  capabilities = ["pull", "resolve"]

