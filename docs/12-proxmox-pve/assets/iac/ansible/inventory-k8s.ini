# 现有 K8s 集群 inventory（来自 m01 /root/ansible-k8s-inventory.ini，已去掉密码相关配置）
# 用法：
#   ansible-inventory -i inventory-k8s.ini --graph
#   ansible -i inventory-k8s.ini all -m ping
#
# 说明：
#   - 默认用 root + SSH key；如需普通用户，改 ansible_user 并确保 sudo 免密；
#   - 不要把密码写进 inventory，使用 ssh-agent、key 或 ansible-vault。

[k8s_all:children]
k8s_cp
k8s_worker
k8s_lab

[k8s_cp]
m01        ansible_host=10.0.0.61
master01   ansible_host=10.0.0.121
master02   ansible_host=10.0.0.120

[k8s_worker]
worker01   ansible_host=10.0.0.122
worker02   ansible_host=10.0.0.123
worker03   ansible_host=10.0.0.124

# 实验/新增节点（按需取消注释）
[k8s_lab]
# k8s-lab-w01 ansible_host=10.0.0.130
# k8s-lab-w02 ansible_host=10.0.0.131
# k8s-lab-w03 ansible_host=10.0.0.132

[k8s_all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[k8s_cp:vars]
node_role=control-plane

[k8s_worker:vars]
node_role=worker
