apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
imagePullSecrets:
  - name: harbor-pull
---
# Harbor is served with a self-signed certificate; containerd skips verification
# (see /etc/containerd/certs.d/192.168.67.202:8443/hosts.toml on every node).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"192.168.67.202:8443":{"username":"admin","password":"<redacted-harbor-admin-password>","auth":"<base64-admin-password>"}}}