apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-rbd-sc
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-config
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  WEBUI_SECRET_KEY: "d255fd996b786721b0c84cf04a8f852cbfa98fca4e5843ddab34e9e55a984dbe"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      serviceAccountName: open-webui
      # Open WebUI takes a while to boot (model downloads, migrations)
      terminationGracePeriodSeconds: 60
      containers:
        - name: open-webui
          image: open-webui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /app/backend/data
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: WEBUI_NAME
              value: "Open WebUI"
            - name: WEBUI_URL
              value: "http://cngpt.ccwu.cc"
            - name: OFFLINE_MODE
              value: "true"
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: WEBUI_AUTH
              value: "True"
          envFrom:
            - secretRef:
                name: open-webui-config
          # Right-sized after 7d of Prometheus data: actual usage is ~10m CPU
          # and ~315Mi memory (max), with only periodic health/version polling.
          # Keep ~3x memory headroom for startup and occasional document parsing.
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: cache
              mountPath: /app/backend/cache

        # ---- sidecar: injects the x-opencode-session header required by
        # opencode.ai/zen/go (Open WebUI cannot send custom headers itself).
        # Loopback only; see base/05-opencode-proxy-configmap.yaml for details.
        - name: opencode-proxy
          image: 192.168.67.202:8443/openwebui/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 11435
          volumeMounts:
            - name: opencode-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 11435
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 11435
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: opencode-proxy-config
          configMap:
            name: opencode-proxy
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        # containerd overlayfs can grow large; give the image layer its own cache dir
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: cngpt.ccwu.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  name: http