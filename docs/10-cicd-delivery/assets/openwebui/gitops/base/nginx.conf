worker_processes 1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Upstream latency to opencode.ai can be high, and chat completions stream
  # for minutes. Keep timeouts generous so nginx never cuts a request the
  # upstream would otherwise have served.
  proxy_connect_timeout 10s;
  proxy_send_timeout    900s;
  proxy_read_timeout    900s;

  # Streamed (SSE) chat responses must not be buffered.
  proxy_buffering         off;
  proxy_request_buffering off;
  proxy_cache             off;
  chunked_transfer_encoding on;

  log_format proxy '$remote_addr "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout proxy;

  # ------------------------------------------------------------------
  # Upstream IP pinning
  #
  # opencode.ai sits behind Cloudflare, and this network can only reach
  # *one* of its anycast addresses. Measured repeatedly from the Pod:
  #   172.65.90.21 -> HTTP 200 in ~0.75s  (reliably reachable)
  #   172.65.90.20 / .22 / .23           -> TCP connect never completes
  #
  # Plain DNS round-robin therefore picks a dead address most of the time,
  # which shows up as sporadic 30-60s hangs. (Listing all four with
  # max_fails/fail_timeout did NOT help: nginx retried the dead ones and
  # still hung for the full connect timeout.)
  #
  # So we pin the one address that answers, and keep proxy_connect_timeout
  # short so that if Cloudflare ever moves it we fail fast and visibly
  # instead of hanging.
  #
  # TO RE-DISCOVER the working address after an outage, run from the Pod:
  #   for ip in $(getent ahostsv4 opencode.ai | awk '{print $1}' | sort -u); do
  #     curl -s -o /dev/null -m 20 -w "$ip %{http_code} %{time_total}s\n" \
  #       --resolve "opencode.ai:443:$ip" https://opencode.ai/zen/go/v1/models
  #   done
  # then update OPENCODE_UPSTREAM_IP below.
  # ------------------------------------------------------------------
  upstream opencode_zen {
    server 172.65.90.21:443;
  }

  server {
    listen 11435;
    server_name _;

    # Open WebUI calls /v1/models and /v1/chat/completions.
    # Strip the leading /v1 and re-add it under the real upstream prefix so
    #   /v1/chat/completions -> https://opencode.ai/zen/go/v1/chat/completions
    location /v1/ {
      proxy_pass https://opencode_zen/zen/go/v1/;

      # --- headers required by the opencode.ai Go endpoint ---
      # Stable session id. Kept constant so all traffic from this instance
      # lands on one upstream backend, which maximises prompt cache hits.
      # (A per-conversation id would be the alternative, but Open WebUI only
      # exposes the chat id as a header when built with
      # ENABLE_FORWARD_USER_INFO_HEADERS=true.)
      proxy_set_header x-opencode-session "open-webui-cngpt";

      # Docs ask for an application-specific User-Agent rather than a
      # generic SDK / HTTP-library name.
      proxy_set_header User-Agent "open-webui/0.12.0 (self-hosted; opencode-go)";

      # Upstream TLS: SNI + certificate verification still use opencode.ai
      # even though we connect to a bare IP.
      proxy_ssl_server_name on;
      proxy_ssl_name       opencode.ai;
      proxy_ssl_protocols  TLSv1.2 TLSv1.3;

      proxy_set_header Host opencode.ai;
      # Forward the caller's Authorization (the opencode API key) unchanged.
      proxy_pass_request_headers on;
      proxy_intercept_errors off;
    }

    # Bare /v1 request (no trailing path).
    location = /v1 {
      proxy_pass https://opencode_zen/zen/go/v1/;
      proxy_set_header x-opencode-session "open-webui-cngpt";
      proxy_set_header User-Agent "open-webui/0.12.0 (self-hosted; opencode-go)";
      proxy_ssl_server_name on;
      proxy_ssl_name       opencode.ai;
      proxy_ssl_protocols  TLSv1.2 TLSv1.3;
      proxy_set_header Host opencode.ai;
    }

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Anything else -> upstream root, for easier debugging.
    location / {
      proxy_pass https://opencode_zen/zen/go/;
      proxy_set_header x-opencode-session "open-webui-cngpt";
      proxy_set_header User-Agent "open-webui/0.12.0 (self-hosted; opencode-go)";
      proxy_ssl_server_name on;
      proxy_ssl_name       opencode.ai;
      proxy_ssl_protocols  TLSv1.2 TLSv1.3;
      proxy_set_header Host opencode.ai;
    }
  }
}
