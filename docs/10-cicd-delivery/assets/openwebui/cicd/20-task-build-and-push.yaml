apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: openwebui-cicd
spec:
  description: Build the Open WebUI image with Kaniko and push it to Harbor
  params:
    - name: image
      type: string
      description: Fully-qualified destination image (registry/project/name:tag)
    - name: context
      type: string
      default: source
      description: Sub-path of the workspace holding the build context
    - name: dockerfile
      type: string
      default: Dockerfile.harbor
  workspaces:
    - name: source
  # huggingface.co is unreachable from this network, so build the SLIM variant:
  # it skips baking embedding/whisper models into the image (they are fetched
  # lazily at runtime instead) and installs a much smaller dependency set.
  steps:
    - name: build
      # gcr.io is unreachable from this network; Kaniko is mirrored into Harbor.
      image: 192.168.67.202:8443/openwebui/kaniko:v1.23.2
      workingDir: $(workspaces.source.path)/$(params.context)
      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
      securityContext:
        runAsUser: 0
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.context)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --build-arg
        - USE_SLIM=true
        # Harbor uses a self-signed certificate and is served over HTTPS
        - --insecure
        - --skip-tls-verify
        - --insecure-pull
        - --cache=true
        - --cache-repo=192.168.67.202:8443/openwebui/cache
        - --single-snapshot
        - --verbosity=info
  volumes:
    - name: docker-config
      secret:
        secretName: harbor-auth
        items:
          - key: .dockerconfigjson
            path: config.json