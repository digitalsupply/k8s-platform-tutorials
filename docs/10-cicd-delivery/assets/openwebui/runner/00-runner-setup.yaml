---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    app.kubernetes.io/part-of: openwebui-cicd
---
# Runner config: k8s executor, talks to GitLab over http://192.168.67.201
#
# NOTE: registry.gitlab.com is unreachable from this network, so the helper
# image (normally pulled from there) is mirrored into Harbor and referenced
# explicitly below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: gitlab-runner
  labels:
    app.kubernetes.io/part-of: openwebui-cicd
data:
  runners.toml: |
    [[runners]]
      name = "openwebui-k8s-runner"
      id = 1
      executor = "kubernetes"
      token = "<redacted-runner-token>"
      url = "http://192.168.67.201"
      [runners.kubernetes]
        namespace = "gitlab-runner"
        executor_namespace = "gitlab-runner"
        image_pull_secrets = ["harbor-auth"]
        helper_image = "192.168.67.202:8443/openwebui/gitlab-runner-helper:x86_64-v17.8.3"
        helper_image_pull_policy = "IfNotPresent"
      [runners.kubernetes.pod_template]
        namespace = "gitlab-runner"
        image_pull_secrets = ["harbor-auth"]