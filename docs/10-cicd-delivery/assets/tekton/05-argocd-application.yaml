apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compassio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: compassio-cicd
spec:
  project: default
  source:
    repoURL: http://192.168.67.201/digitalsupply/compassio-gitops.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: compassio
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Secrets are bootstrapped out of band; never prune them from a sync.
      - Prune=false
