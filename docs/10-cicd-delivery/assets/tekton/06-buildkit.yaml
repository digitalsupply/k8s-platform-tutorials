# Compassio CI/CD — BuildKit daemon (kaniko 继任者, moby 官方现役方案)
# buildkitd.toml: docker.io 全部走 1ms.run 镜像源（本环境无 Docker Hub 直连）
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: compassio-cicd
data:
  buildkitd.toml: |
    [worker.oci]
      max-parallelism = 4
    [registry."docker.io"]
      mirrors = ["docker.1ms.run", "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"]
    [registry."192.168.67.202:8443"]
      ca = ["/bundle/ca-bundle.crt"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: cicd
  labels:
    app: buildkitd
    app.kubernetes.io/part-of: compassio-cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      nodeSelector:
        kubernetes.io/hostname: m01
      imagePullSecrets:
        - name: harbor-auth
      initContainers:
        - name: make-ca-bundle
          image: 192.168.67.202:8443/compassio/python:3.11-slim
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /harbor/harbor.crt > /bundle/ca-bundle.crt
          volumeMounts:
            - name: harbor-ca
              mountPath: /harbor
            - name: ca-bundle
              mountPath: /bundle
        - name: init-cache
          # hostPath 由 kubelet 以 root 创建；把顶层目录交给 uid 1000（buildkitd 用户）
          image: 192.168.67.202:8443/compassio/python:3.11-slim
          command:
            - sh
            - -c
            - mkdir -p /cache && chown 1000:1000 /cache && chmod 0770 /cache
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /cache
      containers:
        - name: buildkitd
          # 镜像本身经 1ms.run 镜像源拉取
          image: 192.168.67.202:8443/compassio/buildkit:v0.20.2-rootless
          args:
            - --oci-worker-no-process-sandbox
            - --config=/etc/buildkit/buildkitd.toml
            - --addr=tcp://0.0.0.0:1234
          securityContext:
            # 注意：rootless buildkit 必须用 Unconfined；RuntimeDefault 会阻断
            # rootlesskit 的 namespace 创建（fork/exec /proc/self/exe: operation not permitted）
            seccompProfile:
              type: Unconfined
            runAsGroup: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 1234
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
            - name: home
              mountPath: /home/user/.local/share/buildkit
            - name: ca-bundle
              mountPath: /bundle
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-bundle.crt
              readOnly: true
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: home
          hostPath:
            path: /var/lib/buildkitd-cache
            type: DirectoryOrCreate
        - name: harbor-ca
          configMap:
            name: buildkitd-ca
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: compassio-cicd
spec:
  selector:
    app: buildkitd
  ports:
    - name: tcp
      port: 1234
      targetPort: 1234
