# 蓝绿：blue/green 两套 Deployment 同时存在，Service selector 一次切换。
# 优点：切换/回滚是秒级；缺点：发布期间双倍资源，数据库需兼容两版。
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-blue, namespace: demo}
spec:
  replicas: 3
  selector: {matchLabels: {app: web, color: blue}}
  template:
    metadata: {labels: {app: web, color: blue}}
    spec:
      containers:
        - name: web
          image: 192.168.67.202:8443/compassio/frontend:BLUE_GIT_SHA
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-green, namespace: demo}
spec:
  replicas: 3
  selector: {matchLabels: {app: web, color: green}}
  template:
    metadata: {labels: {app: web, color: green}}
    spec:
      containers:
        - name: web
          image: 192.168.67.202:8443/compassio/frontend:GREEN_GIT_SHA
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo}
spec:
  # 发布：把 blue 改成 green；回滚：再改回 blue
  selector: {app: web, color: blue}
  ports: [{port: 80, targetPort: 8080}]
