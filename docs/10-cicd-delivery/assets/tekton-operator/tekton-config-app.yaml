apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.67.201/digitalsupply/tekton-platform-gitops.git
    targetRevision: main
    path: config
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
