  metrics:
    enabled:
    - drop
    - tcp
    - flow
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
      trustCRDsExist: true
  relay:
    enabled: true
  ui:
    enabled: true
kubeProxyReplacement: "false"
l7Proxy: false
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
      trustCRDsExist: true
  replicas: 2
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    trustCRDsExist: true
routingMode: native
