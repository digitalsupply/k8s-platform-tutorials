apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calico-node-felix
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: calico-node
  podMetricsEndpoints:
    - port: felix-metrics
      interval: 15s
      path: /metrics
      scheme: http
