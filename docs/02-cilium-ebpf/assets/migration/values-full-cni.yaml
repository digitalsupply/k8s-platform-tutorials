enableLBIPAM: false
defaultLBServiceIPAM: none

cluster:
  name: home

k8sServiceHost: 10.0.0.168
k8sServicePort: 6443

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
autoDirectNodeRoutes: true
devices: eth0

ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true

kubeProxyReplacement: "false"
bpf:
  masquerade: false
  hostLegacyRouting: true

l7Proxy: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - drop
      - tcp
      - flow
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
      labels:
        release: prometheus

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    labels:
      release: prometheus

operator:
  replicas: 2
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
      labels:
        release: prometheus
