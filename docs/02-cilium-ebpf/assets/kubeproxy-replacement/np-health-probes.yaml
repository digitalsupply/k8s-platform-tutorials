apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-health-probes
  namespace: china-study-free
spec:
  podSelector:
    matchLabels:
      app: china-study-free
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8787
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-health-probes
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wecom-adapter
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-health-probes
  namespace: tekton-pipelines
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 8008
          protocol: TCP
        - port: 9097
          protocol: TCP
