# 示例文件：不要把真实 encryptedData 提交到公开仓库。
# 生成方式：
#   kubectl -n monitoring create secret generic wecom-adapter \
#     --from-literal=webhook-url='https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...' \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml \
#       --controller-name sealed-secrets-controller \
#       --controller-namespace kube-system \
#   > sealedsecret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wecom-adapter
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    webhook-url: <replace-with-kubeseal-output>
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alerting-adapter
        app.kubernetes.io/name: wecom-adapter
      name: wecom-adapter
      namespace: monitoring
    type: Opaque
