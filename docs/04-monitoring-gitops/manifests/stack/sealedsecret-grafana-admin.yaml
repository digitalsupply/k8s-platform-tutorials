# 示例文件：不要把真实 encryptedData 提交到公开仓库。
# 生成方式见 docs/04-monitoring-gitops/prometheus-alertmanager-ops-guide.md。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prometheus-grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    admin-user: <replace-with-kubeseal-output>
    admin-password: <replace-with-kubeseal-output>
    ldap-toml: <replace-with-kubeseal-output>
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kube-prometheus-stack
      name: prometheus-grafana-admin
      namespace: monitoring
    type: Opaque
