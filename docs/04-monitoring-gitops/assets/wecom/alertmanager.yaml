global:
  resolve_timeout: 5m
route:
  receiver: n8n-webhook
  group_by:
  - alertname
  - namespace
  - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
  - receiver: wecom
    matchers:
    - severity =~ "critical|warning"
    continue: true
  - receiver: n8n-webhook
    matchers:
    - severity =~ "critical|warning"
receivers:
- name: n8n-webhook
  webhook_configs:
  - send_resolved: true
    url: http://n8n-svc.n8n.svc.cluster.local:5678/webhook/k8s-alerts
- name: wecom
  webhook_configs:
  - send_resolved: true
    url: http://wecom-adapter.monitoring.svc.cluster.local:8080/alerts
inhibit_rules:
# 与线上生成的配置保持一致（3 条）：critical 抑制同 namespace+alertname 的 warning/info，
# warning 抑制 info，InfoInhibitor 抑制所在 namespace 的 info。
- target_matchers: [severity =~ "warning|info"]
  source_matchers: [severity = "critical"]
  equal: [namespace, alertname]
- target_matchers: [severity = "info"]
  source_matchers: [severity = "warning"]
  equal: [namespace, alertname]
- target_matchers: [alertname = "InfoInhibitor"]
  source_matchers: [alertname = "InfoInhibitor"]
  equal: [namespace]
templates:
- /etc/alertmanager/config/*.tmpl
