apiVersion: v1
data:
  tempo-query.yaml: |
    backend: 127.0.0.1:3200
  tempo.yaml: |2

    backend_scheduler:
      backend_flush_interval: 1m
      job_timeout: 15s
      local_work_path: /var/tempo
      maintenance_interval: 1m
      provider:
        compaction:
          compaction:
            block_retention: 48h
            compacted_block_retention: 1h
            compaction_cycle: 30s
            compaction_window: 1h
            max_block_bytes: 107374182400
            max_compaction_objects: 6000000
            max_time_per_tenant: 5m
            retention_concurrency: 10
          max_compaction_level: 0
          max_input_blocks: 4
          max_jobs_per_tenant: 1000
          min_cycle_interval: 30s
          min_input_blocks: 2
        retention:
          interval: 1h
      work:
        dead_job_timeout: 24h
        prune_age: 1h
    backend_worker:
      backend_scheduler_addr: tempo3-backend-scheduler:9095
      backoff:
        max_period: 1m
        max_retries: 0
        min_period: 100ms
      compaction:
        block_retention: 48h
        compacted_block_retention: 1h
        compaction_cycle: 30s
        compaction_window: 1h
        max_block_bytes: 107374182400
        max_compaction_objects: 6000000
        max_time_per_tenant: 5m
        retention_concurrency: 10
      finish_on_shutdown_timeout: 30s
      ring:
        kvstore:
          store: memberlist
    block_builder:
      partitions_per_instance: 1
    cache:
      caches:
      - memcached:
          consistent_hash: true
          host: tempo3-memcached
          service: memcached-client
          timeout: 500ms
        roles:
        - parquet-footer
        - bloom
        - frontend-search
    distributor:
      log_received_spans:
        enabled: true
        filter_by_status_error: false
        include_all_attributes: false
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      ring:
        kvstore:
          store: memberlist
    ingest:
      kafka:
        address: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
        auto_create_topic_default_partitions: 3
        auto_create_topic_enabled: true
        topic: tempo-traces
    live_store:
      ring:
        kvstore:
          store: memberlist
    memberlist:
      abort_if_cluster_join_fails: false
      bind_addr: []
      bind_port: 7946
      cluster_label: 'tempo3.logging'
      gossip_interval: 1s
      gossip_nodes: 2
      gossip_to_dead_nodes_time: 30s
      join_members:
      - dns+tempo3-gossip-ring:7946
      leave_timeout: 5s
      left_ingesters_timeout: 5m
      max_join_backoff: 1m
      max_join_retries: 10
      min_join_backoff: 1s
      node_name: ""
      packet_dial_timeout: 5s
      packet_write_timeout: 5s
      pull_push_interval: 30s
      randomize_node_name: true
      rejoin_interval: 0s
      retransmit_factor: 2
      stream_timeout: 10s
    metrics_generator:
      metrics_ingestion_time_range_slack: 30s
      processor:
        service_graphs:
          dimensions: []
          histogram_buckets:
          - 0.1
          - 0.2
          - 0.4
          - 0.8
          - 1.6
          - 3.2
          - 6.4
          - 12.8
          max_items: 10000
          wait: 10s
          workers: 10
        span_metrics:
          dimensions: []
          histogram_buckets:
          - 0.002
          - 0.004
          - 0.008
          - 0.016
          - 0.032
          - 0.064
          - 0.128
          - 0.256
          - 0.512
          - 1.02
          - 2.05
          - 4.1
      registry:
        collection_interval: 15s
        external_labels: {}
        stale_duration: 15m
      ring:
        kvstore:
          store: memberlist
      storage:
        path: /var/tempo/wal
        remote_write:
        - send_exemplars: true
          url: http://prometheus-prometheus.monitoring:9090/api/v1/write
        remote_write_add_org_id_header: true
        remote_write_flush_deadline: 1m
        wal: null
    multitenancy_enabled: false
    overrides:
      defaults: {}
      per_tenant_override_config: /runtime-config/overrides.yaml
    querier:
      frontend_worker:
        frontend_address: tempo3-query-frontend-discovery:9095
      max_concurrent_queries: 20
      search:
        query_timeout: 30s
      trace_by_id:
        query_timeout: 10s
    query_frontend:
      max_outstanding_per_tenant: 2000
      max_retries: 2
      mcp_server:
        enabled: false
      metrics:
        concurrent_jobs: 1000
        duration_slo: 0s
        interval: 5m
        max_duration: 3h
        query_backend_after: 15m
        target_bytes_per_job: 104857600
        throughput_bytes_slo: 0
      search:
        concurrent_jobs: 1000
        max_spans_per_span_set: 100
        target_bytes_per_job: 104857600
      trace_by_id:
        query_shards: 50
    server:
      grpc_server_max_recv_msg_size: 4194304
      grpc_server_max_send_msg_size: 4194304
      http_listen_port: 3200
      http_server_read_timeout: 30s
      http_server_write_timeout: 30s
      log_format: logfmt
      log_level: info
    storage:
      trace:
        backend: s3
        blocklist_poll: 5m
        local:
          path: /var/tempo/traces
        pool:
          max_workers: 400
          queue_depth: 20000
        s3:
          access_key: <redacted>
          bucket: tempo-traces
          endpoint: 10.0.0.31:7480
          forcepathstyle: true
          insecure: true
          region: us-east-1
          secret_key: <redacted>
        search:
          prefetch_trace_count: 1000
        wal:
          path: /var/tempo/wal
    stream_over_http_enabled: false
    usage_report:
      reporting_enabled: true
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: tempo3
    meta.helm.sh/release-namespace: logging
  creationTimestamp: "2026-09-28T06:19:52Z"
