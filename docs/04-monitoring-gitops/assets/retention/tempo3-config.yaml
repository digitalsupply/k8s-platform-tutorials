    app.kubernetes.io/instance: tempo3
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tempo
    app.kubernetes.io/version: 3.0.3
    helm.sh/chart: tempo-distributed-3.7.0
  name: tempo3-config
  namespace: logging
