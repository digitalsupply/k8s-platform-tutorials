apiVersion: v1
items:
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      argocd.argoproj.io/tracking-id: platform-monitoring-rules:monitoring.coreos.com/PrometheusRule:monitoring/app-monitoring-alerts
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-09-30T00:37:16Z"
    generation: 2
    labels:
      platform.gitops/managed: "true"
      release: prometheus
    name: app-monitoring-alerts
    namespace: monitoring
    resourceVersion: "59041718"
    uid: 873d2da1-7e09-42a7-a347-2afab18da897
  spec:
    groups:
    - name: cert-manager.rules
      rules:
      - alert: CertManagerCertificateExpiringSoon
        annotations:
          summary: '证书即将过期: {{ $labels.namespace }}/{{ $labels.name }} (剩余 {{ $value
            | humanizeDuration }})'
        expr: |
          certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
      - alert: CertManagerCertificateExpired
        annotations:
          summary: '证书已过期: {{ $labels.namespace }}/{{ $labels.name }}'
        expr: |
          certmanager_certificate_expiration_timestamp_seconds - time() < 0
        for: 5m
        labels:
          severity: critical
      - alert: CertManagerNotReady
        annotations:
          summary: 'cert-manager 证书非 Ready: {{ $labels.namespace }}/{{ $labels.name
            }}'
        expr: |
          certmanager_certificate_ready_status{condition="True"} == 0
        for: 15m
        labels:
          severity: warning
    - name: tekton.rules
      rules:
      - alert: TektonPipelineRunFailed
        annotations:
          summary: 'PipelineRun 失败: {{ $labels.namespace }}/{{ $labels.pipelinerun
            }}'
        expr: |
          tekton_pipelines_controller_pipelinerun_count{status="failed"} - tekton_pipelines_controller_pipelinerun_count{status="failed"} offset 5m > 0
        for: 5m
        labels:
          severity: warning
      - alert: TektonTaskRunFailed
        annotations:
          summary: 'TaskRun 失败: {{ $labels.namespace }}/{{ $labels.taskrun }}'
        expr: |
          tekton_pipelines_controller_taskrun_count{status="failed"} - tekton_pipelines_controller_taskrun_count{status="failed"} offset 5m > 0
        for: 5m
        labels:
          severity: warning
    - name: traefik.rules
      rules:
      - alert: TraefikHigh5xxRate
        annotations:
          summary: 'traefik 5xx 率过高: {{ $labels.service }}'
        expr: |
          sum by (service) (
            sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
            /
            (sum by (service) (rate(traefik_service_requests_total[5m])) > 0)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
    - name: kafka.rules
      rules:
      - alert: KafkaClusterOperatorDown
        annotations:
          summary: strimzi cluster operator 不可用
        expr: |
          up{job="kafka/strimzi-cluster-operator"} == 0
        for: 5m
        labels:
          severity: critical
    - name: storage.rules
      rules:
      - alert: CephCSIOperationErrors
        annotations:
          summary: 'ceph-csi 操作失败: {{ $labels.driver_name }} ({{ $labels.grpc_status_code
            }})'
        expr: |
          increase(csi_sidecar_operations_seconds_count{driver_name="rbd.csi.ceph.com"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
    - name: cnpg.rules
      rules:
      - alert: CNPGControllerManagerDown
        annotations:
          summary: cnpg controller-manager 不可用
        expr: |
          up{job="cnpg-system/cnpg-controller-manager"} == 0
        for: 5m
        labels:
          severity: critical
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      argocd.argoproj.io/tracking-id: platform-monitoring-rules:monitoring.coreos.com/PrometheusRule:monitoring/bsm-coverage-alerts
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-02T06:38:37Z"
    generation: 2
    labels:
      platform.gitops/managed: "true"
      release: prometheus
    name: bsm-coverage-alerts
    namespace: monitoring
    resourceVersion: "59041713"
    uid: e76e7d45-f97a-4926-9419-7031c1f95955
  spec:
    groups:
    - name: bsm.availability
      rules:
      - alert: CoreComponentNotReady
        annotations:
          description: 覆盖所有无 metrics 端点的组件；已排除非 Running 状态的 Pod（如已完成的 Job/一次性任务）
          summary: '核心组件 Pod 未就绪: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: sum by (namespace, pod) (kube_pod_status_ready{namespace=~"kube-system|argocd|logging|n8n|nfs-provisioner|kafka|knative-serving|knative-eventing|knative-operator|cert-manager|traefik|ceph-csi-rbd|tekton-pipelines|monitoring|opentelemetry",condition="true"})
          * on(namespace,pod) group_left() (kube_pod_status_phase{phase="Running"}
          > 0) < 1
        for: 10m
        labels:
          severity: warning
      - alert: CNIComponentNotReady
        annotations:
          description: CNI 故障=该节点网络不可用，影响面最大
          summary: 'Calico CNI 未就绪: {{ $labels.pod }}'
        expr: sum by (pod) (kube_pod_status_ready{namespace="kube-system",pod=~"calico-node-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: CNIKubeControllersDown
        annotations:
          description: 网络策略下发与 IP 回收依赖此控制器
          summary: calico-kube-controllers 未就绪
        expr: sum(kube_pod_status_ready{namespace="kube-system",pod=~"calico-kube-controllers-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: MetalLBSpeakerNotReady
        annotations:
          description: speaker 负责 ARP/NDP 应答，异常=LoadBalancer 流量不通
          summary: 'MetalLB speaker 未就绪: {{ $labels.pod }}'
        expr: sum by (pod) (kube_pod_status_ready{namespace="metallb-system",pod=~"speaker-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: AlertReceiverDown
        annotations:
          description: n8n 是 AlertManager webhook 的实际接收端，挂了所有告警静默
          summary: n8n 不可用（告警出口）
        expr: sum(kube_pod_status_ready{namespace="n8n",pod=~"n8n-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: StorageProvisionerDown
        annotations:
          description: PVC 动态供给依赖它，故障=新 Pod 分配不到存储
          summary: nfs-provisioner 不可用
        expr: sum(kube_pod_status_ready{namespace="nfs-provisioner",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: KubeVIPDown
        annotations:
          description: 控制面 VIP 漂移异常
          summary: kube-vip-ds 不可用
        expr: sum(kube_pod_status_ready{namespace="kube-system",pod=~"kube-vip-ds-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: warning
      - alert: GitOpsRedisDown
        annotations:
          description: ArgoCD 缓存与队列依赖 Redis
          summary: ArgoCD Redis 不可用
        expr: sum(kube_pod_status_ready{namespace="argocd",pod=~"argocd-redis-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: warning
      - alert: KafkaEntityOperatorDown
        annotations:
          description: 负责 Topic/User 的实际创建删除
          summary: Kafka Entity Operator 不可用
        expr: sum(kube_pod_status_ready{namespace="kafka",pod=~"my-cluster-entity-operator-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: TektonInterceptorsDown
        annotations:
          description: GitOps webhook 校验会失败
          summary: Tekton 拦截器不可用
        expr: sum(kube_pod_status_ready{namespace="tekton-pipelines",pod=~"tekton-triggers-core-interceptors-.*",condition="true"})
          < 1
        for: 10m
        labels:
          severity: warning
      - alert: PodCrashLoopingFixed
        annotations:
          description: 直接读 K8s 上报的容器等待原因，不受计数器序列断裂影响（比 rate() 方案可靠）
          summary: 'Pod 崩溃循环: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})
          > 0
        for: 15m
        labels:
          severity: warning
    - name: bsm.coverage
      rules:
      - alert: DaemonSetNotFullyScheduled
        annotations:
          description: 节点级组件（日志采集/CNI）漏跑=该节点监控/网络能力缺失
          summary: 'DaemonSet 未覆盖全部节点: {{ $labels.namespace }}/{{ $labels.daemonset
            }}'
        expr: sum(kube_daemonset_status_desired_number_scheduled{namespace=~"kube-system|logging"})
          - sum(kube_daemonset_status_number_ready{namespace=~"kube-system|logging"})
          > 0
        for: 15m
        labels:
          severity: warning
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      argocd.argoproj.io/tracking-id: platform-monitoring-rules:monitoring.coreos.com/PrometheusRule:monitoring/ceph-cluster-alerts
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-01T14:43:20Z"
    generation: 1
    labels:
      platform.gitops/managed: "true"
      release: prometheus
    name: ceph-cluster-alerts
    namespace: monitoring
    resourceVersion: "59041720"
    uid: 1c52bb26-4119-4cf8-8217-4902a2686ca1
  spec:
    groups:
    - name: ceph.health
      rules:
      - alert: CephClusterUnhealthy
        annotations:
          summary: Ceph 集群健康异常 (status={{ $value }})
        expr: ceph_health_status{cluster="ceph-prod"} != 0
        for: 2m
        labels:
          severity: critical
      - alert: CephClusterHealthUnknown
        annotations:
          summary: Ceph 健康指标缺失，监控已失明
        expr: absent(ceph_health_status{cluster="ceph-prod"})
        for: 5m
        labels:
          severity: critical
      - alert: CephMGRMetricsMissing
        annotations:
          summary: Ceph mgr prometheus 端点不可达。mgr prometheus 模块仅在 active mgr 运行，若 ceph-01
            失联导致 ceph-02 升主，需把新 mgr IP 加入 ScrapeConfig staticConfigs
        expr: absent(ceph_mon_quorum_status{cluster="ceph-prod"})
        for: 5m
        labels:
          severity: critical
      - alert: CephMGRUnreachable
        annotations:
          summary: Ceph mgr metrics target 不可达
        expr: up{job="ceph-mgr"} == 0
        for: 3m
        labels:
          severity: critical
    - name: ceph.mon
      rules:
      - alert: CephMonQuorumLost
        annotations:
          summary: Ceph monitor quorum 丢失，剩余 {{ $value }}/3
        expr: sum(ceph_mon_quorum_status{cluster="ceph-prod"} == 1) < 2
        for: 1m
        labels:
          severity: critical
      - alert: CephMonNotInQuorum
        annotations:
          summary: Ceph monitor 未全部在 quorum 中
        expr: sum(ceph_mon_quorum_status{cluster="ceph-prod"}) != 3
        for: 5m
        labels:
          severity: warning
    - name: ceph.osd
      rules:
      - alert: CephOSDDown
        annotations:
          summary: 有 {{ $value }} 个 Ceph OSD 处于 down
        expr: count(ceph_osd_up{cluster="ceph-prod"} == 0) > 0
        for: 2m
        labels:
          severity: critical
      - alert: CephOSDOutOfCluster
        annotations:
          summary: 有 {{ $value }} 个 Ceph OSD 被标记 out
        expr: count(ceph_osd_in{cluster="ceph-prod"} == 0) > 0
        for: 5m
        labels:
          severity: critical
      - alert: CephOSDHighCommitLatency
        annotations:
          summary: Ceph OSD 平均提交延迟 {{ $value }}ms 偏高
        expr: avg(ceph_osd_commit_latency_ms{cluster="ceph-prod"}) > 50
        for: 10m
        labels:
          severity: warning
      - alert: CephTooFewOSDs
        annotations:
          summary: Ceph 集群在线 OSD 少于 3 个（{{ $value }}），失去冗余
        expr: count(ceph_osd_up{cluster="ceph-prod"} == 1) < 3
        for: 5m
        labels:
          severity: critical
    - name: ceph.pg
      rules:
      - alert: CephPGIncomplete
        annotations:
          summary: 有 {{ $value }} 个 PG 处于 incomplete（数据不完整）
        expr: count(ceph_pg_incomplete{cluster="ceph-prod"} == 1) > 0
        for: 2m
        labels:
          severity: critical
      - alert: CephPGDegraded
        annotations:
          summary: 有 {{ $value }} 个 PG 处于 degraded
        expr: count(ceph_pg_degraded{cluster="ceph-prod"} == 1) > 0
        for: 5m
        labels:
          severity: warning
      - alert: CephPGStale
        annotations:
          summary: 有 {{ $value }} 个 PG 处于 stale
        expr: count(ceph_pg_stale{cluster="ceph-prod"} == 1) > 0
        for: 5m
        labels:
          severity: warning
      - alert: CephPGScrubbingError
        annotations:
          summary: 有 {{ $value }} 个 PG scrub 报错
        expr: count(ceph_pg_scrubbing{cluster="ceph-prod"} == 1) > 0
        for: 30m
        labels:
          severity: warning
    - name: ceph.capacity
      rules:
      - alert: CephPoolNearFull
        annotations:
          summary: Ceph 池 {{ $labels.pool_id }} 使用率 {{ $value }}%，超过 85%
        expr: max by (pool_id) (ceph_pool_percent_used{cluster="ceph-prod"}) > 85
        for: 15m
        labels:
          severity: warning
      - alert: CephPoolCriticallyFull
        annotations:
          summary: Ceph 池 {{ $labels.pool_id }} 使用率 {{ $value }}%，有耗尽风险
        expr: max by (pool_id) (ceph_pool_percent_used{cluster="ceph-prod"}) > 95
        for: 5m
        labels:
          severity: critical
      - alert: CephClusterNearFull
        annotations:
          summary: Ceph 集群总使用率超过 85%
        expr: 1 - (ceph_cluster_total_used_bytes{cluster="ceph-prod"} / (ceph_cluster_total_used_bytes{cluster="ceph-prod"}
          + ceph_cluster_total_bytes{cluster="ceph-prod"})) < 0.15
        for: 15m
        labels:
          severity: warning
      - alert: CephClusterCriticallyFull
        annotations:
          summary: Ceph 集群总使用率超过 95%，紧急
        expr: 1 - (ceph_cluster_total_used_bytes{cluster="ceph-prod"} / (ceph_cluster_total_used_bytes{cluster="ceph-prod"}
          + ceph_cluster_total_bytes{cluster="ceph-prod"})) < 0.05
        for: 5m
        labels:
          severity: critical
      - alert: CephPoolNoSpace
        annotations:
          summary: 有 Ceph 池可用空间为 0
        expr: min(ceph_pool_max_avail{cluster="ceph-prod"}) == 0
        for: 2m
        labels:
          severity: critical
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      argocd.argoproj.io/tracking-id: platform-monitoring-rules:monitoring.coreos.com/PrometheusRule:monitoring/cluster-wide-alerts
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-05-07T13:05:54Z"
    generation: 15
    labels:
      platform.gitops/managed: "true"
      release: prometheus
    name: cluster-wide-alerts
    namespace: monitoring
    resourceVersion: "59041719"
    uid: 981e7578-9099-4cdf-bbd9-98c3113bad0f
  spec:
    groups:
    - name: pod.rules
      rules:
      - alert: PodCrashLooping
        annotations:
          description: 容器 {{ $labels.container }} 近 5 分钟重启 {{ $value }} 次（阈值 >2 次）。注：已修复
            DaemonSet 滚动更新导致的误报——计数器序列断裂会产生伪陡增，原表达式 rate(...[15m])*60>0 阈值过低，任何抖动都会触发。
          summary: 'Pod 频繁重启: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 2
        for: 5m
        labels:
          severity: warning
      - alert: PodNotReady
        annotations:
          summary: 'Pod 未就绪: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: |
          kube_pod_status_ready{condition="true"} == 0
          and kube_pod_status_phase{phase=~"Running|Pending"} == 1
        for: 5m
        labels:
          severity: warning
      - alert: PodOOMKilled
        annotations:
          description: 容器 {{ $labels.namespace }}/{{ $labels.pod }}（{{ $labels.container
            }}）在最近 15 分钟内发生 OOMKill；若已恢复告警会在 15 分钟后自动消失。
          summary: 'OOM Kill: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: |-
          (time() - max by (namespace, pod, container) (kube_pod_container_status_last_terminated_timestamp) < 900)
            and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 1m
        labels:
          severity: critical
      - alert: KubeVIPRestarting
        annotations:
          description: kube-vip 在过去 1 小时重启 {{ $value }} 次。kube-vip 失去 leader 租约会 panic
            并退出(exit 2)，这是其内置行为。根因通常是本节点 kube-apiserver/etcd 出现短暂不可用。已启用 vip_preserve_on_leadership_loss=true，VIP
            不会再被删除，因此不会连带影响 kubelet。排查方向：kubectl logs -n kube-system <pod> --previous
          summary: 'kube-vip 容器 1 小时内发生重启: {{ $labels.pod }} (节点 {{ $labels.node }})'
        expr: sum by (pod, node) (increase(kube_pod_container_status_restarts_total{namespace="kube-system",container="kube-vip"}[1h]))
          > 0
        for: 10m
        labels:
          component: kube-vip
          severity: warning
      - alert: KubeVIPLeadershipChurn
        annotations:
          description: 'plndr-cp-lock 在过去 24h 内出现过 {{ $value }} 个不同的 holder，说明控制面
            API 端点(kube-vip -> 127.0.0.1:6443 -> 本节点 apiserver/etcd) 不稳定，leader 反复丢失租约。关联告警:
            KubeVIPRestarting、KubeVIPLeaderNotRenewing。'
          runbook: kubectl get lease -n kube-system plndr-cp-lock -o yaml; kubectl
            logs -n kube-system -l app.kubernetes.io/name=kube-vip-ds --previous --tail=50
          summary: kube-vip 控制面 VIP leader 在 24 小时内发生切换 ({{ $value }} 个不同 leader)
        expr: count(count by (lease_holder) (max_over_time(kube_lease_owner{namespace="kube-system",lease="plndr-cp-lock"}[24h])))
          > 1
        for: 5m
        labels:
          component: kube-vip
          severity: warning
      - alert: KubeVIPLeaderNotRenewing
        annotations:
          description: |-
            Lease kube-system/plndr-cp-lock 的 renewTime 已停滞超过 90s。

            【根因含义】当前 leader 所在节点无法访问 API Server。kube-vip 在 cp_enable + hostAliases 下实际连接本节点 127.0.0.1:6443，因此通常意味着该节点 kube-apiserver / etcd 异常，或该节点的 kube-vip 容器已崩溃重启。

            【重要】这不是『VIP 消失』型故障，不会再引发级联雪崩。2026-10-04 起已启用 vip_preserve_on_leadership_loss=true（丢失 leader 时保留 VIP、仅停止 ARP 广播），且所有节点 kubelet 已改为直连本机（m01=127.0.0.1:6443，master01=10.0.0.121，master02=10.0.0.120），全集群对 VIP 10.0.0.168:6443 的系统级消费者已归零，因此不会再出现 no route to host / 节点 NotReady。

            【真实影响】控制面 API 端点至少 1/3 副本不可用；VIP 暂时保留在故障前的持有者上，直到新 leader 上任接管。

            【阈值说明】阈值 90s 是刻意设置的：kube-state-metrics 每 30s 才刷新一次 kube_lease_renew_time，健康状态下 time()-renew_time 实测稳定在 30~32s（Prometheus 重启瞬态最高约 62s）。原阈值 30s 恰好等于指标固有陈旧度下限，实测有 82% 的时间处于超阈状态，导致长期误报。
          runbook: |-
            # 1) 当前 leader 是谁、停滞多久、切换了多少次
            kubectl get lease -n kube-system plndr-cp-lock -o jsonpath='{.spec.holderIdentity}{"  renew="}{.spec.renewTime}{"  transitions="}{.spec.leaseTransitions}{"\n"}'; date -u

            # 2) 三个 kube-vip Pod 的重启次数（崩溃者 restartCount>0）
            kubectl get pods -n kube-system -l app.kubernetes.io/name=kube-vip-ds -o wide
            kubectl get pod -n kube-system <pod> -o jsonpath='{.status.containerStatuses[0].lastState.terminated}'

            # 3) leader 节点的崩溃现场日志
            kubectl logs -n kube-system <leader 上的 kube-vip pod> -c kube-vip --previous --tail=50

            # 4) leader 节点本机 apiserver / etcd 健康
            curl -sk https://127.0.0.1:6443/healthz; echo
            curl -sk 'https://127.0.0.1:6443/readyz?verbose' | grep -E 'etcd|ping'
            systemctl is-active kubelet containerd
            journalctl -u kubelet --since '-15min' --no-pager | grep -iE 'no route|connection refused|6443|probe'

            # 5) 确认 VIP 仍然可达（排障期间 API 不应中断）
            curl -sk -o /dev/null -w 'VIP healthz HTTP %{http_code}\n' https://10.0.0.168:6443/healthz

            # 6) 若怀疑是告警本身误报：先确认 renewTime 是否真的在推进（10s 采两次对比）
            kubectl get lease -n kube-system plndr-cp-lock -o jsonpath='{.spec.renewTime}{"\n"}'; sleep 15
            kubectl get lease -n kube-system plndr-cp-lock -o jsonpath='{.spec.renewTime}{"\n"}'
            kubectl exec -n monitoring deploy/prometheus-kube-state-metrics -- wget -qO- localhost:8080/metrics | grep 'kube_lease_renew_time.*plndr-cp-lock'
          summary: kube-vip 控制面 VIP leader 已超过 90s 未更新 renewTime (停滞 {{ $value | humanizeDuration
            }})
        expr: time() - kube_lease_renew_time{namespace="kube-system",lease="plndr-cp-lock"}
          > 90
        for: 1m
        labels:
          component: kube-vip
          severity: critical
    - name: node.rules
      rules:
      - alert: NodeHighCPU
        annotations:
          description: 使用率 {{ $value | humanizePercentage }}
          summary: '节点 CPU 过高: {{ $labels.node }}'
        expr: |
          1 - avg by(node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 5m
        labels:
          severity: warning
      - alert: NodeHighMemory
        annotations:
          description: 使用率 {{ $value | humanizePercentage }}
          summary: '节点内存过高: {{ $labels.instance }}'
        expr: |
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
      - alert: NodeDiskPressure
        annotations:
          description: 剩余 {{ $value | humanizePercentage }}
          summary: '磁盘空间紧张: {{ $labels.instance }} {{ $labels.mountpoint }}'
        expr: |
          (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: critical
    - name: otel-demo.rules
      rules:
      - alert: OtelDemoHighErrorRate
        annotations:
          description: 当前错误率 {{ $value | humanizePercentage }}
          summary: otel-demo 错误率 > 5%
        expr: |
          sum(rate(traces_spanmetrics_calls_total{
            span_kind="SPAN_KIND_SERVER",
            status_code="STATUS_CODE_ERROR",
            namespace="otel-demo"
          }[5m]))
          /
          sum(rate(traces_spanmetrics_calls_total{
            span_kind="SPAN_KIND_SERVER",
            namespace="otel-demo"
          }[5m])) > 0.05
        for: 2m
        labels:
          namespace: otel-demo
          severity: warning
      - alert: OtelDemoServiceDown
        annotations:
          summary: '服务下线: {{ $labels.job }}'
        expr: up{namespace="otel-demo"} == 0
        for: 1m
        labels:
          namespace: otel-demo
          severity: critical
    - name: workload-reliability.rules
      rules:
      - alert: KubePodHighRestartCount
        annotations:
          description: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container
            }}) 最近15分钟重启超过5次，疑似崩溃循环。注：2026-10-07 由6h/10改为15m/5，采用窗口化increase并缩短实例替换(计数器断链)导致的误报残留。'
          summary: 'Pod 累计重启 {{ $value }} 次: {{ $labels.namespace }}/{{ $labels.pod
            }}'
        expr: max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))
          > 5
        for: 10m
        labels:
          severity: warning
      - alert: KubePodCriticalComponentHighRestart
        annotations:
          description: 控制面/核心组件 Pod 累计重启 > 20 次，稳定性风险高，需尽快排查
          summary: '核心组件 Pod 累计重启严重: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: max by (namespace, pod, container) (kube_pod_container_status_restarts_total{namespace=~"kube-system|argocd|logging|cert-manager"})
          > 20
        for: 1h
        labels:
          severity: critical
      - alert: KubeContainerOOMKilled
        annotations:
          description: 容器因内存不足被 OOM killer 终止。注：cluster-wide-alerts 中已有的 PodOOMKilled
            规则依赖 kube_pod_container_status_last_terminated_reason，该指标在当前集群为 0 序列（KSM
            未采集 last_terminated_reason），本规则改用 cAdvisor 的 container_oom_events_total
            作为可靠来源。
          summary: '容器被 OOM 杀死: {{ $labels.namespace }}/{{ $labels.pod }}'
        expr: increase(container_oom_events_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
    - name: cache-config.rules
      rules:
      - alert: MemcachedLimitAboveContainerLimit
        annotations:
          description: '{{ $labels.namespace }}/{{ $labels.pod }} 的 memcached -m 上限
            {{ $value | humanize1024 }}B 超过容器 limit，缓存填满即被 OOMKill；把 -m 调到 limit 的约
            70%。'
          summary: memcached 配置的缓存上限大于容器内存限制（必然 OOM）
        expr: |-
          memcached_limit_maxbytes_bytes
            > on (namespace, pod) group_left (container)
              kube_pod_container_resource_limits{resource="memory", container="memcached"}
        for: 10m
        labels:
          component: cache
          severity: warning
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      argocd.argoproj.io/tracking-id: platform-monitoring-rules:monitoring.coreos.com/PrometheusRule:monitoring/coverage-gap-alerts
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-01T14:18:54Z"
    generation: 5
    labels:
      platform.gitops/managed: "true"
      release: prometheus
    name: coverage-gap-alerts
    namespace: monitoring
    resourceVersion: "59041722"
    uid: 16854106-6dd6-4a4f-87d0-c7e43e82ad0f
  spec:
    groups:
    - name: logging-pipeline.rules
      rules:
      - alert: AlloyDown
        annotations:
          description: Alloy 是日志链路入口，该 Pod 不可用会导致日志静默丢失
          summary: 'Alloy 日志采集 Pod 不可用: {{ $labels.pod }}'
        expr: count by (pod) (up{namespace="logging",job=~"alloy"} == 0) or (absent(up{namespace="logging",job=~"alloy"})
          and vector(1))
        for: 5m
        labels:
          severity: critical
      - alert: AlloyDesiredCountMismatch
        annotations:
          description: 部分节点的日志未被采集。当前 desired=6 / ready=6，正常时应为 0
          summary: Alloy 未覆盖全部节点（就绪 {{ $value }} 个未就绪）
        expr: sum(kube_daemonset_status_desired_number_scheduled{namespace="logging",daemonset=~"alloy.*"})
          - sum(kube_daemonset_status_number_ready{namespace="logging",daemonset=~"alloy.*"})
          > 0
        for: 10m
        labels:
          severity: critical
      - alert: LokiIngestStalled
        annotations:
          description: Loki write/backend/read 链路中断，日志将无法写入或查询。注：2026-10-07 修复——原规则
            job=~"loki-write|..." 与实际 job 名("logging/loki-write" 带命名空间前缀)不匹配，absent()
            恒真导致长期误报。
          summary: Loki 组件不可用
        expr: absent(up{namespace="logging",job=~"logging/loki-write|logging/loki-backend|logging/loki-read"})
          or sum(up{namespace="logging",job=~"logging/loki-write|logging/loki-backend|logging/loki-read"}
          == 0) > 0
        for: 5m
        labels:
          severity: critical
    - name: cni.rules
      rules:
      - alert: CalicoNodeNotReady
        annotations:
          description: CNI 异常会导致该节点网络不可用，Pod 无法调度/通信
          summary: 'Calico CNI Pod 未就绪: {{ $labels.pod }}'
        expr: sum by (pod) (kube_pod_status_ready{namespace="kube-system",pod=~"calico-node-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: critical
      - alert: CalicoKubeControllersDown
        annotations:
          description: 控制器异常会影响网络策略下发与 IP 回收。注意：该 Pod 无独立 metrics target（无 ServiceMonitor/PodMonitor），因此改用
            kube-state-metrics 的 kube_pod_status_ready 判定
          summary: calico-kube-controllers 未就绪
        expr: sum(kube_pod_status_ready{namespace="kube-system",pod=~"calico-kube-controllers-.*",condition="true"})
          < 1
        for: 5m
        labels:
          severity: warning
    - name: loadbalancer.rules
      rules:
      - alert: MetalLBSpeakerHighRestart
        annotations:
          summary: 'MetalLB speaker 高频重启: {{ $labels.pod }}'
        expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="metallb-system",pod=~"speaker-.*"}[1h]))
          > 3
        for: 15m
        labels:
          severity: warning
    - name: gitops.rules
      rules:
      - alert: ArgoCDRepoServerDown
        annotations:
          description: GitOps 同步会阻塞，集群期望状态无法自动收敛
          summary: ArgoCD repo-server 不可用
        expr: min(up{namespace="argocd",pod=~"argocd-repo-server-.*"}) == 0 or absent(up{namespace="argocd",pod=~"argocd-repo-server-.*"})
        for: 5m
        labels:
          severity: critical
      - alert: ArgoCDHighRestart
        annotations:
          description: argocd 命名空间内 pod 最近15分钟重启超过3次。注：2026-10-07 窗口由1h改为15m，统一窗口化increase语义，消除实例替换(计数器断链)产生的长时间误报残留。
          summary: 'ArgoCD 组件高频重启: {{ $labels.pod }}'
        expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="argocd"}[15m]))
          > 3
        for: 15m
        labels:
          severity: warning
    - name: default-workloads.rules
      rules:
      - alert: DefaultNSDeploymentUnavailable
        annotations:
          description: 可用副本数低于期望，可能伴随探针失败（如 report-processor 的 503）
          summary: 'default ns 副本不足: {{ $labels.deployment }} ({{ $labels.namespace
            }})'
        expr: |-
          sum by (namespace, deployment) (
            kube_deployment_status_replicas_available{namespace="default"}
            < kube_deployment_spec_replicas{namespace="default"}
          ) > 0
        for: 10m
        labels:
          severity: warning
      - alert: DefaultNSProbeFailing
        annotations:
          description: 容器处于 CrashLoopBackOff 或镜像拉取失败状态
          summary: 'default ns 容器异常: {{ $labels.pod }}/{{ $labels.container }}'
        expr: |-
          count by (pod, container) (
            kube_pod_container_status_waiting_reason{namespace="default",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"}
          ) > 0
        for: 10m
        labels:
          severity: warning
